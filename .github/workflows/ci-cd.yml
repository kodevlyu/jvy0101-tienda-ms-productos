name: CI-CD Microservicio productos

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Compilar, probar y construir imagen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_local
          POSTGRES_DB: catalogo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d catalogo_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/catalogo_db
      SPRING_DATASOURCE_USERNAME: ci_user
      SPRING_DATASOURCE_PASSWORD: ci_test_local
      SQS_ENABLED: "false"

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B clean verify

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-productos
          path: target/surefire-reports/
          retention-days: 7

      - name: Construir imagen Docker
        run: docker build -t ms-productos:${{ github.sha }} .

      - name: Verificar imagen Docker
        run: docker image inspect ms-productos:${{ github.sha }}
